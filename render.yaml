services:
  - type: web
    name: kampusten
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

databases:
  - name: kampusten-db
    databaseName: kampusten
    user: kampusten

